# Supabase CLI configuration for local development (`npx supabase start`).
# Hosted projects are configured in the dashboard — see README "Supabase setup".
project_id = "joud-portfolio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Public registration is disabled: administrators are provisioned manually.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# Public endpoints: they perform their own validation/authorization and are
# called with the publishable key, which is not a JWT.
[functions.contact]
verify_jwt = false

[functions.cv-url]
verify_jwt = false
